name: Android Safe Install APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-safeinstall-apk.yml"
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-safeinstall-apk.yml"

jobs:
  assemble-safeinstall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare stable signing
        shell: bash
        env:
          ARIANA_DEBUG_KEYSTORE_B64: ${{ secrets.ARIANA_DEBUG_KEYSTORE_B64 }}
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "ARIANA_STABLE_SIGNING=disabled" >> "$GITHUB_ENV"
            echo "Feature-branch build: using ephemeral Android debug key."
            exit 0
          fi
          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" || -z "$ARIANA_DEBUG_STORE_PASSWORD" || -z "$ARIANA_DEBUG_KEY_ALIAS" || -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "::error::Stable signing secrets are missing or incomplete."
            exit 1
          fi
          printf '%s' "$ARIANA_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ariana-debug.jks"
          chmod 600 "$RUNNER_TEMP/ariana-debug.jks"
          echo "ARIANA_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/ariana-debug.jks" >> "$GITHUB_ENV"
          echo "ARIANA_STABLE_SIGNING=enabled" >> "$GITHUB_ENV"

      - name: Assemble safe-install APK
        working-directory: android
        env:
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: gradle :app:assembleSafeinstall --stacktrace

      - name: Verify safe-install package and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/safeinstall -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort -V | tail -n 1)"
          test -n "$APK"
          test -n "$APKSIGNER"
          test -n "$APKANALYZER"
          "$APKSIGNER" verify --print-certs "$APK" | tee android/app/build/outputs/apk/safeinstall/signing-certificate.txt
          "$APKANALYZER" manifest print "$APK" > android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          grep -F 'package="de.snowworks.app.safe"' android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          ! grep -Fq 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          ! grep -Fq 'android.permission.ACCESS_FINE_LOCATION' android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          ! grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          ! grep -Fq 'android.permission.BLUETOOTH_CONNECT' android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          ! grep -Fq 'android.permission.BLUETOOTH_SCAN' android/app/build/outputs/apk/safeinstall/merged-manifest.xml

      - name: Upload safe-install APK
        uses: actions/upload-artifact@v4
        with:
          name: ariana-x88-safe-install
          path: |
            android/app/build/outputs/apk/safeinstall/*.apk
            android/app/build/outputs/apk/safeinstall/signing-certificate.txt
            android/app/build/outputs/apk/safeinstall/merged-manifest.xml
          if-no-files-found: error
