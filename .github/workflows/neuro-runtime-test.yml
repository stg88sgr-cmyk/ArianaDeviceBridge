name: V16-V31 Neuro Runtime Gate

on:
  push:
    branches: [ x88-evolution-g2 ]
    paths:
      - 'android/app/src/main/java/de/snowworks/ariana/neuro/**'
      - 'android/app/src/test/java/de/snowworks/ariana/neuro/**'
      - 'android/app/src/main/java/de/snowworks/ariana/world/**'
      - 'android/app/src/test/java/de/snowworks/ariana/world/**'
      - 'android/app/src/main/java/de/snowworks/app/SnowworksApp.kt'
      - 'android/app/src/main/java/de/snowworks/app/ui/HomeAiEngineIndicator.kt'
      - '.github/workflows/neuro-runtime-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuro-runtime-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neuro-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version

      - name: Bootstrap Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 3 --retry-delay 2 \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -o /tmp/android-tools.zip
          rm -rf /tmp/android-tools
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          cp -R /tmp/android-tools/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Install Gradle 8.11.1 directly
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 \
            https://services.gradle.org/distributions/gradle-8.11.1-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Verify V16-V31 stage continuity in source
        shell: bash
        run: |
          set -euo pipefail
          base='android/app/src/main/java/de/snowworks/ariana/neuro/NeuroRuntime.kt'
          advanced='android/app/src/main/java/de/snowworks/ariana/neuro/NeuroRuntimeV21V30.kt'
          observability='android/app/src/main/java/de/snowworks/ariana/neuro/NeuroRuntimeV31.kt'
          world='android/app/src/main/java/de/snowworks/ariana/world/X88FantasyWorldEngine.kt'
          bootstrap='android/app/src/main/java/de/snowworks/ariana/world/X88FantasyWorldBootstrap.kt'
          hud='android/app/src/main/java/de/snowworks/app/ui/HomeAiEngineIndicator.kt'
          test -f "$base"
          test -f "$advanced"
          test -f "$observability"
          test -f "$world"
          test -f "$bootstrap"
          test -f "$hud"
          for version in $(seq 16 20); do
            grep -Eq "V${version}[A-Za-z0-9_]+" "$base"
          done
          for version in $(seq 21 30); do
            grep -Eq "V${version}[A-Za-z0-9_]+" "$advanced"
          done
          grep -Eq 'class V31NeuroRuntime|data class V31RuntimeSnapshot' "$observability"
          grep -F 'runtime-observability-gate' "$observability"
          grep -F 'requiresSecurityChain", "true"' "$advanced"
          grep -F 'executionMode", "proposal_only"' "$advanced"
          grep -F 'physicalEffect" to "false"' "$world"
          grep -F 'V31NeuroRuntime.initialize()' 'android/app/src/main/java/de/snowworks/app/SnowworksApp.kt'
          grep -F 'X88FantasyWorldBootstrap.attach' 'android/app/src/main/java/de/snowworks/app/SnowworksApp.kt'
          grep -F 'V31NeuroRuntime.currentOrNull()?.snapshot()' "$hud"
          grep -F 'X88FantasyWorldBootstrap.currentOrNull()' "$hud"

      - name: Run V16-V31 and fantasy-world tests
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest \
            --tests 'de.snowworks.ariana.neuro.V16ToV20NeuroRuntimeTest' \
            --tests 'de.snowworks.ariana.neuro.V21ToV30NeuroRuntimeTest' \
            --tests 'de.snowworks.ariana.neuro.V31NeuroRuntimeTest' \
            --tests 'de.snowworks.ariana.world.X88FantasyWorldEngineTest' \
            --stacktrace
