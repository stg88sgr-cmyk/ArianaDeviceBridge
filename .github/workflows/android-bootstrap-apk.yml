name: Android Bootstrap APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-bootstrap-apk.yml"

jobs:
  assemble-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare stable bootstrap signing
        shell: bash
        env:
          ARIANA_DEBUG_KEYSTORE_B64: ${{ secrets.ARIANA_DEBUG_KEYSTORE_B64 }}
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" || -z "$ARIANA_DEBUG_STORE_PASSWORD" || -z "$ARIANA_DEBUG_KEY_ALIAS" || -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "::error::Stable ARIANA signing is required for bootstrap builds."
            exit 1
          fi
          printf '%s' "$ARIANA_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ariana-debug.jks"
          chmod 600 "$RUNNER_TEMP/ariana-debug.jks"
          echo "ARIANA_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/ariana-debug.jks" >> "$GITHUB_ENV"
          echo "ARIANA_STABLE_SIGNING=enabled" >> "$GITHUB_ENV"

      - name: Bootstrap manifest source gate
        run: |
          grep -F 'ArianaNotificationListener' android/app/src/bootstrap/AndroidManifest.xml
          grep -F 'tools:node="remove"' android/app/src/bootstrap/AndroidManifest.xml

      - name: Voice recovery unit gate
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests de.snowworks.ariana.voice.ConversationVoicePolicyTest --stacktrace

      - name: Assemble bootstrap APK
        working-directory: android
        env:
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: gradle :app:assembleBootstrap --stacktrace

      - name: Verify merged bootstrap manifest
        run: |
          APK=$(find android/app/build/outputs/apk/bootstrap -name '*.apk' | head -1)
          APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | head -1)
          test -n "$APK"
          test -n "$APKANALYZER"
          "$APKANALYZER" manifest print "$APK" > /tmp/bootstrap-manifest.xml
          grep -F 'package="de.snowworks.app.bootstrap"' /tmp/bootstrap-manifest.xml
          test "${ARIANA_STABLE_SIGNING:-disabled}" = "enabled"
          ! grep -Fq 'ArianaNotificationListener' /tmp/bootstrap-manifest.xml
          ! grep -Fq 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' /tmp/bootstrap-manifest.xml
          ! grep -Fq 'android.permission.ACCESS_FINE_LOCATION' /tmp/bootstrap-manifest.xml
          ! grep -Fq 'android.permission.ACCESS_COARSE_LOCATION' /tmp/bootstrap-manifest.xml
          ! grep -Fq 'android.permission.BLUETOOTH_CONNECT' /tmp/bootstrap-manifest.xml
          ! grep -Fq 'android.permission.BLUETOOTH_SCAN' /tmp/bootstrap-manifest.xml

      - name: Upload bootstrap APK
        uses: actions/upload-artifact@v4
        with:
          name: snowworks-ariana-bootstrap
          path: android/app/build/outputs/apk/bootstrap/*.apk
          if-no-files-found: error
