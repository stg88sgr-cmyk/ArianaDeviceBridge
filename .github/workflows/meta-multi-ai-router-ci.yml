name: Meta Multi-AI Router CI

on:
  workflow_dispatch:
  push:
    branches:
      - feature/meta-multi-ai-router
    paths:
      - "android/**"
      - ".github/workflows/meta-multi-ai-router-ci.yml"

jobs:
  compile-router:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK without legacy tools package
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Multi-AI source gate
        shell: bash
        run: |
          set -euo pipefail
          router='android/app/src/main/java/de/snowworks/ariana/bridge/MultiAiRouter.kt'
          judge='android/app/src/main/java/de/snowworks/ariana/bridge/MultiAiJudge.kt'
          repair='android/app/src/main/java/de/snowworks/ariana/bridge/MultiAiRepairLoop.kt'
          repair_test='android/app/src/test/java/de/snowworks/ariana/bridge/MultiAiRepairLoopTest.kt'
          health='android/app/src/main/java/de/snowworks/ariana/bridge/AiProviderHealth.kt'
          store='android/app/src/main/java/de/snowworks/ariana/bridge/SecureAiProviderStore.kt'
          manager='android/app/src/main/java/de/snowworks/ariana/bridge/AiProviderManager.kt'
          dialogue='android/app/src/main/java/de/snowworks/ariana/bridge/DialogueRouter.kt'
          app='android/app/src/main/java/de/snowworks/app/SnowworksApp.kt'
          settings='android/app/src/main/java/de/snowworks/app/ui/AiProviderSettingsActivity.kt'

          test -f "$router"
          test -f "$judge"
          test -f "$repair"
          test -f "$repair_test"
          test -f "$health"
          grep -F 'enum class Mode' "$router"
          grep -F 'Mode.META' "$router"
          grep -F 'Mode.PARALLEL' "$router"
          grep -F 'Mode.REVIEW' "$router"
          grep -F 'Mode.CONSENSUS' "$router"
          grep -F 'Mode.REPAIR' "$router"
          grep -F 'SecureAiProviderStore' "$router"
          grep -F 'HttpsDialogueProvider' "$router"
          grep -F 'remoteProviderIsPrimary' "$router"
          grep -F 'DISTINCT_PRIMARY_UNAVAILABLE' "$router"
          grep -F 'MultiAiJudge.decide' "$router"
          grep -F 'AiProviderHealth.acquireAttempt' "$router"
          grep -F 'META_CIRCUIT_OPEN' "$router"
          grep -F 'MultiAiRepairLoop.MAX_ROUNDS' "$router"
          grep -F 'REVIEW_UNAVAILABLE' "$router"

          grep -F 'enum class Verdict' "$judge"
          grep -F 'PRIMARY' "$judge"
          grep -F 'META' "$judge"
          grep -F 'MERGE' "$judge"
          grep -F 'Sicherheit/Datenschutz' "$judge"

          grep -F 'const val MAX_ROUNDS = 2' "$repair"
          grep -F 'enum class Status' "$repair"
          grep -F 'STATUS: PASS|FIX' "$repair"
          grep -F 'Keine Aktionen ausfuehren' "$repair"
          grep -F 'rejectsFixWithoutCandidate' "$repair_test"
          grep -F 'promptsStayBounded' "$repair_test"

          grep -F 'FAILURE_THRESHOLD = 3' "$health"
          grep -F 'COOLDOWN_MS = 60_000L' "$health"
          grep -F 'halfOpenProbeInFlight' "$health"
          grep -F 'PROVIDER_AUTH_FAILED' android/app/src/test/java/de/snowworks/ariana/bridge/AiProviderHealthTest.kt

          grep -F 'KEY_PREVIOUS_CONFIG' "$store"
          grep -F 'fun restorePrevious()' "$store"
          grep -F 'fun hasRecoverySnapshot()' "$store"
          grep -F 'fun restorePrevious(context: Context)' "$manager"
          grep -F 'recoveryAvailable' "$manager"
          grep -F 'Letzten Provider-Stand wiederherstellen' "$settings"

          grep -F '"/meta"' "$dialogue"
          grep -F '"/parallel"' "$dialogue"
          grep -F '"/review"' "$dialogue"
          grep -F '"/consensus"' "$dialogue"
          grep -F '"/repair"' "$dialogue"
          grep -F 'DialogueRouter.initialize(this)' "$app"
          grep -F 'https://api.meta.ai/v1/chat/completions' "$settings"
          grep -F 'muse-spark-1.3' "$settings"

      - name: Compile Kotlin and run unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
