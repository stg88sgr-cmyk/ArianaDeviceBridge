name: Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare stable debug signing
        shell: bash
        env:
          ARIANA_DEBUG_KEYSTORE_B64: ${{ secrets.ARIANA_DEBUG_KEYSTORE_B64 }}
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" && -z "$ARIANA_DEBUG_STORE_PASSWORD" && -z "$ARIANA_DEBUG_KEY_ALIAS" && -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "ARIANA_STABLE_SIGNING=disabled" >> "$GITHUB_ENV"
            echo "Stable signing is not configured; using the ephemeral Android debug key."
            exit 0
          fi

          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" || -z "$ARIANA_DEBUG_STORE_PASSWORD" || -z "$ARIANA_DEBUG_KEY_ALIAS" || -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "::error::ARIANA stable signing secrets are incomplete. Configure all four signing secrets or remove them all."
            exit 1
          fi

          printf '%s' "$ARIANA_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ariana-debug.jks"
          chmod 600 "$RUNNER_TEMP/ariana-debug.jks"
          echo "ARIANA_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/ariana-debug.jks" >> "$GITHUB_ENV"
          echo "ARIANA_STABLE_SIGNING=enabled" >> "$GITHUB_ENV"

      - name: X-88 Core v1 source smoke gate
        run: |
          grep -F 'InetAddress.getByName("127.0.0.1")' android/app/src/main/java/de/snowworks/ariana/bridge/LocalBridgeServer.kt
          grep -F 'path == "/state" && method == "GET"' android/app/src/main/java/de/snowworks/ariana/bridge/LocalBridgeServer.kt
          grep -F 'LocalBridgeServer.start(this)' android/app/src/main/java/de/snowworks/app/SnowworksApp.kt
          grep -Eq 'versionCode = [1-9][0-9]*' android/app/build.gradle.kts
          grep -Eq 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' android/app/build.gradle.kts

      - name: X-88 loopback security self-test v2 gate
        shell: bash
        run: |
          set -euo pipefail
          test_file='android/app/src/main/java/de/snowworks/ariana/bridge/BridgeSelfTest.kt'
          ui_file='android/app/src/main/java/de/snowworks/app/ui/DeviceGrantsActivity.kt'
          grep -F 'DialogueSessionStore.hasActiveSession()' "$test_file"
          grep -F 'name = "Einmal-Pairing"' "$test_file"
          grep -F 'name = "Pairing-Replay-Sperre"' "$test_file"
          grep -F 'name = "Bearer-Abweisung"' "$test_file"
          grep -F 'name = "Bearer-Akzeptanz + Input-Gate"' "$test_file"
          grep -F '"DIALOGUE_SESSION_UNAUTHORIZED"' "$test_file"
          grep -F '"INVALID_INPUT"' "$test_file"
          grep -F 'Kein KI-Provider wurde aufgerufen.' "$test_file"
          grep -F 'DialogueSessionStore.revoke()' "$test_file"
          grep -F 'ARIANA Core v2 · OK' "$ui_file"
          grep -F 'check.skipped' "$ui_file"

      - name: X-88 action proposal v1 non-execution gate
        shell: bash
        run: |
          set -euo pipefail
          policy_file='android/app/src/main/java/de/snowworks/ariana/bridge/ActionPolicy.kt'
          server_file='android/app/src/main/java/de/snowworks/ariana/bridge/LocalBridgeServer.kt'
          test_file='android/app/src/main/java/de/snowworks/ariana/bridge/BridgeSelfTest.kt'

          grep -F 'enum class Decision { SAFE, CONFIRM, BLOCKED }' "$policy_file"
          grep -F 'val executable: Boolean = false' "$policy_file"
          grep -F '"camera_start"' "$policy_file"
          grep -F 'decision = Decision.CONFIRM' "$policy_file"
          grep -F 'reason = "ACTION_NOT_ALLOWLISTED"' "$policy_file"
          ! grep -F 'ArianaCaptureService' "$policy_file"
          ! grep -F 'CameraFrameStore' "$policy_file"

          grep -F 'path == "/v1/action/proposal" && method == "POST"' "$server_file"
          grep -F 'private fun actionProposal' "$server_file"
          grep -F '.put("model", "x88-action-proposal-v1")' "$server_file"
          grep -F '.put("executable", evaluation.executable)' "$server_file"

          proposal_body="$(awk '/private fun actionProposal/{flag=1} /private fun providerHttpStatus/{flag=0} flag' "$server_file")"
          grep -F 'ActionPolicy.evaluate' <<<"$proposal_body"
          ! grep -F 'action(context' <<<"$proposal_body"
          ! grep -F 'ArianaCaptureService' <<<"$proposal_body"
          ! grep -F 'DialogueRouter.generate' <<<"$proposal_body"

          grep -F 'name = "ActionProposal Bearer-Gate"' "$test_file"
          grep -F 'expectedDecision = "SAFE"' "$test_file"
          grep -F 'expectedDecision = "CONFIRM"' "$test_file"
          grep -F 'expectedDecision = "BLOCKED"' "$test_file"
          grep -F '!json.optBoolean("executable", true)' "$test_file"

      - name: X-88 human approval v1 non-execution gate
        shell: bash
        run: |
          set -euo pipefail
          approval_file='android/app/src/main/java/de/snowworks/ariana/bridge/ActionApprovalStore.kt'
          policy_file='android/app/src/main/java/de/snowworks/ariana/bridge/ActionPolicy.kt'
          session_file='android/app/src/main/java/de/snowworks/ariana/bridge/DialogueSessionStore.kt'
          test_file='android/app/src/main/java/de/snowworks/ariana/bridge/BridgeSelfTest.kt'
          ui_file='android/app/src/main/java/de/snowworks/app/ui/DeviceGrantsActivity.kt'

          grep -F 'const val PROPOSAL_TTL_MS = 2 * 60 * 1000L' "$approval_file"
          grep -F 'const val APPROVAL_TTL_MS = 60 * 1000L' "$approval_file"
          grep -F 'fun createPending' "$approval_file"
          grep -F 'fun approve' "$approval_file"
          grep -F 'fun deny' "$approval_file"
          grep -F 'fun consumeForAction' "$approval_file"
          grep -F 'fun revokeAll' "$approval_file"
          ! grep -F 'import android.' "$approval_file"
          ! grep -F 'ArianaCaptureService' "$approval_file"
          ! grep -F 'CameraFrameStore' "$approval_file"
          ! grep -F 'NotificationStore' "$approval_file"
          ! grep -F 'ArianaDeviceApi' "$approval_file"

          grep -F 'ActionApprovalStore.createPending' "$policy_file"
          grep -F 'pendingProposalId = pending.id' "$policy_file"
          grep -F 'ActionApprovalStore.revokeAll()' "$session_file"

          grep -F 'name = "Approval Pending-Queue"' "$test_file"
          grep -F 'name = "Lokale Einmalfreigabe"' "$test_file"
          grep -F 'name = "Approval Action-Bindung + Einmaligkeit"' "$test_file"
          grep -F 'consumeForAction("microphone_start") == null' "$test_file"
          grep -F 'consumeForAction("camera_start")' "$test_file"

          grep -F 'X-88 Aktionsfreigaben' "$ui_file"
          grep -F 'ActionApprovalStore.approve' "$ui_file"
          grep -F 'ActionApprovalStore.deny' "$ui_file"
          grep -F 'Noch nichts ausgeführt' "$ui_file"
          grep -F 'ActionApprovalStore.revokeAll()' "$ui_file"

      - name: Assemble debug APK
        working-directory: android
        env:
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Report APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee android/app/build/outputs/apk/debug/signing-certificate.txt
          echo "Signing mode: ${ARIANA_STABLE_SIGNING:-unknown}" | tee -a android/app/build/outputs/apk/debug/signing-certificate.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snowworks-ariana-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/signing-certificate.txt
          if-no-files-found: error
