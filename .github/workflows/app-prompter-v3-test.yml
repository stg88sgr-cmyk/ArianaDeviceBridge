name: App Prompter V3 Tests

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/app-prompter-v3-test.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/app-prompter-v3-test.yml"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: App Prompter unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --tests de.snowworks.ariana.prompter.AppPrompterEngineTest --stacktrace