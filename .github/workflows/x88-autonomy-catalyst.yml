name: X88 Autonomy Catalyst

on:
  push:
    branches:
      - x88-autonomy-catalyst
    paths:
      - "tools/x88/**"
      - "android/**"
      - ".github/workflows/x88-autonomy-catalyst.yml"
  pull_request:
    paths:
      - "tools/x88/**"
      - "android/**"
      - ".github/workflows/x88-autonomy-catalyst.yml"
  workflow_dispatch:

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile controller
        run: python -m py_compile tools/x88/x88_build_controller.py

      - name: Controller unit tests
        working-directory: tools/x88
        run: python -m unittest -v test_x88_build_controller.py

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME/platforms/android-35"
          echo "Android platforms:"
          ls -1 "$ANDROID_HOME/platforms"
          echo "Build tools:"
          ls -1 "$ANDROID_HOME/build-tools" | tail -n 10

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests + debug APK
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --parallel --build-cache --configuration-cache --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: x88-autonomy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
