name: X88 Autonomy Catalyst

on:
  push:
    branches:
      - x88-autonomy-catalyst
    paths:
      - "tools/x88/**"
      - "android/**"
      - ".github/workflows/x88-autonomy-catalyst.yml"
  pull_request:
    paths:
      - "tools/x88/**"
      - "android/**"
      - ".github/workflows/x88-autonomy-catalyst.yml"
  workflow_dispatch:

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile X88 tooling
        run: python -m py_compile tools/x88/x88_build_controller.py tools/x88/android16_gate.py

      - name: X88 tooling unit tests
        working-directory: tools/x88
        run: python -m unittest -v test_x88_build_controller.py test_android16_gate.py

      - name: Android 16 runtime safety gate
        run: python tools/x88/android16_gate.py --repo .

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android 16 / API 36 source gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'id("com.android.application") version "8.9.1" apply false' android/build.gradle.kts
          grep -F 'compileSdk = 36' android/app/build.gradle.kts
          grep -F 'targetSdk = 36' android/app/build.gradle.kts
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties

      - name: Ensure Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/tmp/x88-sdkmanager.log || {
              cat /tmp/x88-sdkmanager.log
              exit 1
            }
          fi
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "API 36 SDK ready"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare stable debug signing
        shell: bash
        env:
          ARIANA_DEBUG_KEYSTORE_B64: ${{ secrets.ARIANA_DEBUG_KEYSTORE_B64 }}
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" && -z "$ARIANA_DEBUG_STORE_PASSWORD" && -z "$ARIANA_DEBUG_KEY_ALIAS" && -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "ARIANA_STABLE_SIGNING=disabled" >> "$GITHUB_ENV"
            echo "Stable signing is not configured; using Android's ephemeral debug certificate."
            exit 0
          fi

          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" || -z "$ARIANA_DEBUG_STORE_PASSWORD" || -z "$ARIANA_DEBUG_KEY_ALIAS" || -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "::error::Stable signing is partially configured. Configure all four ARIANA_DEBUG_* secrets or remove them all."
            exit 1
          fi

          printf '%s' "$ARIANA_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ariana-debug.jks"
          chmod 600 "$RUNNER_TEMP/ariana-debug.jks"
          echo "ARIANA_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/ariana-debug.jks" >> "$GITHUB_ENV"
          echo "ARIANA_STABLE_SIGNING=enabled" >> "$GITHUB_ENV"

      - name: Unit tests + debug APK
        working-directory: android
        env:
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --parallel --build-cache --configuration-cache --stacktrace

      - name: Verify APK package metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee android/app/build/outputs/apk/debug/x88-api36-badging.txt
          grep -F "targetSdkVersion:'36'" android/app/build/outputs/apk/debug/x88-api36-badging.txt

      - name: Verify APK signature provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee android/app/build/outputs/apk/debug/signing-certificate.txt
          echo "Signing mode: ${ARIANA_STABLE_SIGNING:-unknown}" | tee -a android/app/build/outputs/apk/debug/signing-certificate.txt

      - name: SHA-256 APK
        shell: bash
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk/debug
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: x88-autonomy-api36-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/x88-api36-badging.txt
            android/app/build/outputs/apk/debug/signing-certificate.txt
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
