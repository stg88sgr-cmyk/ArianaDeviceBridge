name: X88 V21 Install Gate

on:
  push:
    branches:
      - x88-v21-install-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-installability:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-read-only: true

      - name: Install Android SDK 36 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"

      - name: Verify project identity
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          echo "commit=$(git rev-parse HEAD)"
          git status --short
          test -z "$(git status --porcelain)"

      - name: Unit tests and lint
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build safe install candidates
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleSafeinstall :app:assembleBootstrap --stacktrace

      - name: Verify APK structure signing and metadata
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          OUT="$RUNNER_TEMP/x88-v21-evidence"
          mkdir -p "$OUT"

          verify_apk() {
            local profile="$1"
            local expected_package="$2"
            local dir="android/app/build/outputs/apk/$profile"
            local apk
            apk="$(find "$dir" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$apk"
            test -s "$apk"

            echo "=== $profile ===" | tee -a "$OUT/report.txt"
            unzip -tq "$apk" | tee -a "$OUT/report.txt"
            "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$OUT/$profile-signing.txt"
            "$AAPT" dump badging "$apk" | tee "$OUT/$profile-badging.txt"

            grep -F "package: name='$expected_package'" "$OUT/$profile-badging.txt"
            grep -F "sdkVersion:'28'" "$OUT/$profile-badging.txt"
            grep -F "targetSdkVersion:'36'" "$OUT/$profile-badging.txt"

            sha256sum "$apk" | tee "$OUT/$profile.sha256"
          }

          verify_apk safeinstall de.snowworks.app.safe
          verify_apk bootstrap de.snowworks.app.bootstrap

          {
            echo "### ARIANA X88 V21 Install Gate"
            echo "- Result: APK structure, signature and package metadata verified"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Safe install package: de.snowworks.app.safe"
            echo "- Bootstrap package: de.snowworks.app.bootstrap"
            echo "- minSdk: 28"
            echo "- targetSdk: 36"
            echo '```text'
            cat "$OUT"/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final clean-tree gate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "V21_INSTALL_GATE=PASS"
