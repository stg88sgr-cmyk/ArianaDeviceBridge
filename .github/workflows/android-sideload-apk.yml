name: Android Sideload APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-sideload-apk.yml"

jobs:
  assemble-sideload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare stable debug signing
        shell: bash
        env:
          ARIANA_DEBUG_KEYSTORE_B64: ${{ secrets.ARIANA_DEBUG_KEYSTORE_B64 }}
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" && -z "$ARIANA_DEBUG_STORE_PASSWORD" && -z "$ARIANA_DEBUG_KEY_ALIAS" && -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "ARIANA_STABLE_SIGNING=disabled" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ -z "$ARIANA_DEBUG_KEYSTORE_B64" || -z "$ARIANA_DEBUG_STORE_PASSWORD" || -z "$ARIANA_DEBUG_KEY_ALIAS" || -z "$ARIANA_DEBUG_KEY_PASSWORD" ]]; then
            echo "::error::Stable signing secrets are incomplete."
            exit 1
          fi
          printf '%s' "$ARIANA_DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ariana-debug.jks"
          chmod 600 "$RUNNER_TEMP/ariana-debug.jks"
          echo "ARIANA_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/ariana-debug.jks" >> "$GITHUB_ENV"
          echo "ARIANA_STABLE_SIGNING=enabled" >> "$GITHUB_ENV"

      - name: Assemble sideload APK
        working-directory: android
        env:
          ARIANA_DEBUG_STORE_PASSWORD: ${{ secrets.ARIANA_DEBUG_STORE_PASSWORD }}
          ARIANA_DEBUG_KEY_ALIAS: ${{ secrets.ARIANA_DEBUG_KEY_ALIAS }}
          ARIANA_DEBUG_KEY_PASSWORD: ${{ secrets.ARIANA_DEBUG_KEY_PASSWORD }}
        run: gradle :app:assembleSideload --stacktrace

      - name: Verify sensitive listener removed
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/sideload -name '*.apk' -type f | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee android/app/build/outputs/apk/sideload/signing-certificate.txt
          echo "Signing mode: ${ARIANA_STABLE_SIGNING:-unknown}" | tee -a android/app/build/outputs/apk/sideload/signing-certificate.txt
          "$APKANALYZER" manifest print "$APK" > android/app/build/outputs/apk/sideload/merged-manifest.xml
          if grep -Fq 'android.permission.BIND_NOTIFICATION_LISTENER_SERVICE' android/app/build/outputs/apk/sideload/merged-manifest.xml; then
            echo "::error::Sideload APK still declares notification-listener access."
            exit 1
          fi
          grep -F 'package="de.snowworks.app.sideload"' android/app/build/outputs/apk/sideload/merged-manifest.xml

      - name: Upload sideload APK
        uses: actions/upload-artifact@v4
        with:
          name: ariana-x88-sideload
          path: |
            android/app/build/outputs/apk/sideload/*.apk
            android/app/build/outputs/apk/sideload/signing-certificate.txt
            android/app/build/outputs/apk/sideload/merged-manifest.xml
          if-no-files-found: error
